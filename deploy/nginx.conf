# Reverse proxy for the evaluation system.
#
# The single most important thing here is that the app and the API are served
# from ONE origin. The session cookie is SameSite=Lax, so a browser will not
# attach it to cross-site requests: serving the React build from one host and
# the API from another means login appears to work and every request after it
# silently arrives unauthenticated. Everything else in this file is ordinary.

server {
    listen 80;
    server_name feedback.example.edu;

    # Certbot writes its challenge here before the redirect applies.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name feedback.example.edu;

    ssl_certificate     /etc/letsencrypt/live/feedback.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.example.edu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The app never frames anything and is never framed; there is no inline
    # script in the Vite build.
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "DENY"           always;
    add_header Referrer-Policy         "same-origin"    always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;

    client_max_body_size 4m;   # avatar uploads; the API caps them at 2 MB

    # --- API ---------------------------------------------------------------
    # Same origin as the app, which is what makes the session cookie work.
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # The login throttle in the application is per-process and explicitly not a
    # substitute for this. Ten attempts a minute per address, bursting to five.
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8000/auth/login;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Uploaded avatars --------------------------------------------------
    # Served as static files and never executed, whatever they claim to be.
    location /uploads/ {
        alias /srv/evaluation/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/octet-stream;
        types { image/jpeg jpg jpeg; image/png png; image/gif gif; image/webp webp; }
    }

    # --- The React build ---------------------------------------------------
    root /srv/evaluation/frontend;
    index index.html;

    # Hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: any unknown path is a React route, not a 404.
    # index.html itself must never be cached, or a deploy leaves browsers
    # pointing at asset filenames that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}

